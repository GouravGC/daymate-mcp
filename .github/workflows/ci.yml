
name: DayMate MCP CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/gouravgc/daymate-mcp

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -v

  publish-image:
    name: Build and Publish Docker Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gouravgc/daymate-mcp:latest
            ghcr.io/gouravgc/daymate-mcp:sha-${{ github.sha }}

  deploy-render:
    name: Deploy Published Image to Render
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render with this commit's image
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ghcr.io/gouravgc/daymate-mcp:sha-${{ github.sha }}
        run: |
          set -eu

          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          ENCODED_IMAGE=$(python -c \
            "import os, urllib.parse; print(urllib.parse.quote(os.environ['IMAGE_URL'], safe=''))")

          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) SEPARATOR="&" ;;
            *) SEPARATOR="?" ;;
          esac

          curl --fail --silent --show-error \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${SEPARATOR}imgURL=${ENCODED_IMAGE}"

          echo "Render deployment triggered for the published commit image."
